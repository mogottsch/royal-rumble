[project]
name = "royal-rumble-crawler"
version = "0.1.0"
description = "Offline data preparation tools for Suff Royale"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Moritz Gottschling", email = "gottschling.moritz@gmail.com" }
]
dependencies = [
    "aiofiles>=25.1,<26",
    "aiohttp>=3.14,<4",
    "beautifulsoup4>=4.15,<5",
    "joblib>=1.5,<2",
    "pathvalidate>=3.3,<4",
    "pillow>=11.3,<13",
]

[project.scripts]
crawl = "royal_rumble_crawler.crawl:main"
crawl-pictures = "wwe_picture_crawler.main:main"
regenerate-entrance-order = "royal_rumble_crawler.entrance_order:main"

[tool.poetry]
packages = [
    { include = "royal_rumble_crawler", from = "src" },
    { include = "wwe_picture_crawler", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
pip-audit = ">=2.9,<3"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
