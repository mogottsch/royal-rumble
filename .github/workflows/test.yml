name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, iconv, pdo_sqlite, bcmath
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Audit dependencies
        run: composer audit --locked
      - name: Check formatting
        run: vendor/bin/pint --test
      - name: Run Pest on SQLite
        run: vendor/bin/pest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: royal
          POSTGRES_PASSWORD: royal
          POSTGRES_DB: royal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U royal -d royal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend/laravel
    env:
      APP_ENV: testing
      BROADCAST_DRIVER: "null"
      CACHE_DRIVER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: royal_test
      DB_USERNAME: royal
      DB_PASSWORD: royal
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, iconv, pdo_pgsql, bcmath, pcntl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Run migrations on PostgreSQL
        run: php artisan migrate:fresh --force
      - name: Run Pest on PostgreSQL
        run: vendor/bin/pest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_BACKEND_URL: http://localhost:8088
      VITE_PUSHER_HOST: localhost
      VITE_PUSHER_PORT: "6001"
      VITE_PUSHER_SCHEME: http
      VITE_PUSHER_APP_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --run
      - run: yarn audit:dependencies
      - run: yarn build
        env:
          VITE_BACKEND_URL: https://suffroyale.com
          VITE_PUSHER_HOST: ws.suffroyale.com
          VITE_PUSHER_PORT: "443"
          VITE_PUSHER_SCHEME: https

  crawler:
    runs-on: ubuntu-latest
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.4.0
      - run: poetry check --strict
        working-directory: crawler
      - run: poetry install --no-interaction
        working-directory: crawler
      - run: poetry run pytest
        working-directory: crawler
      - run: poetry run pip-audit
        working-directory: crawler

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, crawler]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/smoke-production-images.sh
